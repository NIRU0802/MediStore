[package]
name = "pharmadesk"
version = "1.0.0"
description = "PharmaDesk - Pharmacy POS and Inventory Management"
authors = ["PharmaDesk"]
license = ""
repository = ""
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open", "fs-all", "path-all", "dialog-all", "window-all", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking"] }
